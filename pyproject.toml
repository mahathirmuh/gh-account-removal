[project]
name = "ghremoval"
version = "0.1.0"
description = "Pipeline dan notebook prediksi akun GitHub hilang dari jendela pendek event publik"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.20",
    "duckdb>=1.1",
    "pyarrow>=18",
    "orjson>=3.10",
    "pandas>=2.2",
    "numpy>=2.0",
    "requests>=2.32",
    "tqdm>=4.66",
    "ruamel.yaml>=0.18",
    "pydantic>=2.9",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "torch>=2.15",
    "optuna>=4.0",
    "mlflow>=2.16",
    "jupytext>=1.16",
    "papermill>=2.6",
    "ipykernel>=6.29",
    "nbformat>=5.10",
    "matplotlib>=3.9",
    "jinja2>=3.1",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu132" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghremoval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
