# Dibuat persis dari blok YAML di docs/01-research-design.md
project:
  name: gh-account-removal
  seed: 20261110
  user_agent: "dm-git-research/0.1"

paths:
  token_env_file: "~/.dm-git.env"
  hmac_key_file: "~/.dm-git-hmac.key"
  local_dev_file: "2024-04-01-15.json/2024-04-01-15.json"

data:
  base_url: "https://data.gharchive.org"
  dev_hour: "2024-04-01-15"
  study_hours:
    w0: ["2024-04-09-3", "2024-04-09-15", "2024-04-11-3", "2024-04-11-15", "2024-04-13-3",
      "2024-04-13-15"]
    w1: ["2024-04-16-3", "2024-04-16-15", "2024-04-18-3", "2024-04-18-15", "2024-04-20-3",
      "2024-04-20-15"]
    w2: ["2024-04-23-3", "2024-04-23-15", "2024-04-25-3", "2024-04-25-15", "2024-04-27-3",
      "2024-04-27-15"]
    w3: ["2024-04-30-3", "2024-04-30-15", "2024-05-02-3", "2024-05-02-15", "2024-05-04-3",
      "2024-05-04-15"]

holdout_open: true

label:
  snapshot_date: '2026-11-10'     # diisi otomatis oleh nb04 saat snapshot pertama, lalu jangan diubah
  min_events_to_label: 1
  fallback_min_events: 5          # jika GraphQL legacy ID berhenti berfungsi
  graphql_batch_size: 100
  second_snapshot_min_days: 30

annotation:
  audit_sample_top: 100
  audit_sample_low: 100
  double_annotation_fraction: 0.2  # minimum 0.2
  min_kappa: 0.60

web_crosscheck:
  n_gone: 200
  n_present: 500
  sleep_seconds: 1.2

locked:
  cohorts:
    fixed_min_events: 5
    deployable_min_events: 3
    strata: [[1, 1], [2, 4], [5, 19], [20, null]]
  windows_minutes: [5, 10, 15, 30, 60]
  features:
    age_bins: 12
    drop_families_robust: ["temporal", "repo", "repo_names"]
  splits:
    train_weeks: [w0, w1]
    val_weeks: [w2]
    holdout_weeks: [w3]
    n_folds: 5
    cv_seeds: [42, 43, 44]
    id_block_widths: [5000, 20000, 100000]
    signature_min_events: 10
    artifact_max_accounts: 30
    max_group_pos_share: 0.25
    batch_exclusion: train_positive_block
  models:
    optuna_trials: 24
    optuna_sampler_seeds: [42, 123, 2026]
    final_model_seeds: [42, 43, 44]
  dense_blocks:
    tool: greedy_peeling
    density: arithmetic
    top_k_blocks: 20
  policy:
    target_precisions: [0.5, 0.7, 0.9]
    primary_target_precision: 0.7
    kappa_grid: [0.0, 0.1, 0.25, 0.5]
    q_grid_size: 199
    aurt_horizon_minutes: 75
    aurt_horizon_sensitivity: [65, 90]
  decision:
    min_delta_ap: 0.01
    min_positives_per_stratum: 30
    bootstrap_reps: 2000
    ci_level: 0.95

# Prosedurnya dikunci di docs/06; nilainya diisi sekali oleh nb09 dari data train+val, sebelum holdout dibuka.
derived:
  primary_id_block_width: 20000

reporting:
  figure_dpi: 300
  figure_formats: [pdf, png]
  notebook_language: id
  figure_language: en
